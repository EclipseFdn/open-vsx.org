# EKS (aws-production) values. Self-contained — does not layer on values.yaml.
# OKD deployments use values.yaml.

name: &name open-vsx-org
environment: &environment production
platform: &platform eks
namespace: &namespace open-vsx-org
host: open-vsx.org

# Enables EKS-specific resources and suppresses OKD-only ones (Route, ServiceMonitor,
# RedisCluster CR, redis-cluster-operator, in-chart Alloy ConfigMap, *-aws envFrom).
eks:
  enabled: true

# eks-production has EKS Observability disabled — no kube-state-metrics or
# prometheus-node-exporter installed on the cluster. KSM is deployed by the
# monitoring Terraform module (tf-resources/aws/eu-central-1/monitoring) and
# scraped by Alloy natively; the chart-emitted platform ServiceMonitors stay off.
serviceMonitors:
  platformMetrics:
    enabled: false

# ── Subcharts NOT used in aws-production ────────────────────────────────────────
# postgresql-ha: prod uses AWS RDS (tf-resources/aws/eu-central-1/rds), not in-cluster Postgres
# aws-load-balancer-controller: EKS Auto Mode ships an integrated ALB controller — no standalone install
postgresql-ha:
  enabled: false
aws-load-balancer-controller:
  enabled: false

replicaCount: 3
esReplicaCount: 3

# Must exceed the ALB deregistration_delay of 30s set in ingress annotations below.
preStopDelaySeconds: 35

image:
  repository: ghcr.io/eclipsefdn/openvsx-website
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: 97e1417-99

website:
  # MaxDirectMemorySize caps off-heap so the JVM cannot expand past the cgroup limit
  # under load (2026-05-19 OKD incident: native+direct growth pushed total past 8Gi -> OOMKill).
  jvmArgs: >
    -Xms6G -Xmx8G
    -XX:MaxDirectMemorySize=512m
    -XX:+AlwaysPreTouch
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+UseStringDeduplication
    -XX:+ParallelRefProcEnabled
    -XX:+DisableExplicitGC
    -XX:+UnlockExperimentalVMOptions
    -XX:+UnlockDiagnosticVMOptions
    -XX:-OmitStackTraceInFastThrow
    -Dlog4j2.formatMsgNoLookups=true
    -Dlog4j.formatMsgNoLookups=true
    -Dorg.jooq.no-logo=true
    -Dorg.jooq.no-tips=true
    --enable-native-access=ALL-UNNAMED

# ── ServiceAccount (IRSA) — fill from: tf-resources/aws/eu-central-1/iam output openvsx_app_role_arn ──
serviceAccount:
  create: true
  name: openvsx
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::365555376529:role/openvsx-app"

# ── Nightly backup + restore drill ───────────────────────────────────────────
# Restores the newest RDS automated snapshot to a throwaway instance, dumps it, restores
# that dump back and compares row counts, uploads, then deletes the instance. The live
# database is never touched. Role ARN from: tf-resources/aws/production/eu-central-1/iam
# output db_backup_role_arn.
dbBackupDrill:
  enabled: true
  sourceDbInstance: "openvsx-production"
  # Every identifier the job creates or deletes must start with this. The IAM policy
  # scopes RestoreDBInstanceFromDBSnapshot and DeleteDBInstance to the same prefix.
  drillPrefix: "openvsx-drill-"
  # 03:30 UTC — after the 02:00-03:00 RDS backup window, so the drill verifies the
  # snapshot taken ~1.5h earlier rather than yesterday's. At 01:30 it always read a
  # 23h-old snapshot, which both staled the S3 copy and delayed detection by a day.
  # Finishes ~03:41, clear of the ~04:00 search reindex.
  schedule: "30 3 * * *"
  timeZone: "Etc/UTC"
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Restore measured 7m30s on 2026-09-23; the round trip adds a few minutes. 90m leaves
  # room for a slow restore without letting a wedged job hold an instance all day.
  activeDeadlineSeconds: 5400
  restoreWaitSeconds: 3600
  # Drill economy, not a production replacement: prod is db.r6g.8xlarge on io2.
  instanceClass: "db.t4g.large"
  storageType: "gp3"
  # Dropped and recreated on the throwaway instance for the round-trip check.
  verifyDatabase: "openvsx_restore_check"
  compression: "6"
  statementTimeoutSeconds: 3000
  # The production dump is ~2 GB uncompressed as of 2026-09-23; well under this.
  minDumpBytes: 1048576
  # Snapshots are daily, so the question is "did a backup happen in the last day", not
  # "is this one fresh". At 03:30 a normal snapshot is ~1.4h old and a missed night shows
  # as ~25.4h, so 20h fails the missed night with 5.4h to spare while still letting the
  # job be run by hand at any point during a working day.
  maxSnapshotAgeHours: 20
  scratchSize: 20Gi
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  # Interim: install aws-cli from the alpine repo at container start. Set false once a
  # pinned image carrying pg_dump 16 + aws-cli v2 is published.
  awsCliInstall: true
  s3:
    bucket: "eclipse-openvsx-db-backups"
    prefix: "production"
    region: eu-central-1
  serviceAccount:
    create: true
    # Must match the IRSA trust subject of the role annotated below
    # (system:serviceaccount:open-vsx-org:openvsx-db-backup).
    name: openvsx-db-backup
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::365555376529:role/openvsx-db-backup-production"
  reaper:
    # An orphaned drill instance costs ~$190/month, so the sweep is hourly rather than
    # daily. maxAgeHours must exceed activeDeadlineSeconds or it kills live drills.
    schedule: "15 * * * *"
    maxAgeHours: 3
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
  report:
    # Push the outcome straight to Grafana Cloud Loki using LOKI_* from
    # grafana-cloud-secret-production. Do not rely on scraped stdout: the Alloy logs
    # pipeline drops pods in phase Succeeded/Failed, which is where a Job spends most
    # of its life.
    loki: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 20Gi
    limits:
      memory: 2Gi
      ephemeral-storage: 20Gi

# ── Ingress (ALB/EKS Auto Mode) — fill from TF outputs: vpc→alb_security_group_id, acm→certificate_arn ──
ingress:
  preActions:
    - forward-cors
    - ssl-redirect
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/security-groups: "sg-04eb53c6c5eed3b52"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-central-1:365555376529:certificate/c247a8c7-31fa-4116-bd4a-c1e5aebad840"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}, {"HTTP": 80}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: >
      {"Type": "redirect", "RedirectConfig":
       {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}
    alb.ingress.kubernetes.io/actions.forward-cors: >
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"204"}}
    alb.ingress.kubernetes.io/conditions.forward-cors: >
      [{"field":"http-request-method","httpRequestMethodConfig":{"values":["OPTIONS"]}}]
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-port: "8081"
    # idle_timeout raised from 60s to 300s to match nginx proxy_read_timeout/proxy_send_timeout.
    # Slow VSIX uploads (up to 250MB) need the longer window once nginx is out of the path.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300,routing.http2.enabled=true,deletion_protection.enabled=true,client_keep_alive.seconds=60
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30,slow_start.duration_seconds=0

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  # Limit > request (Burstable QoS): 2Gi memory headroom above the 6G heap for thread stacks,
  # direct buffers, metaspace; CPU limit raised to stop CFS throttling observed during the
  # 2026-05-19 incident where pods needed 6-9 cores against a 5-core ceiling.
  limits:
    cpu: 7000m
    memory: 12Gi
  requests:
    cpu: 3000m
    memory: 10Gi

# ── Elasticsearch ─────────────────────────────────────────────────────────────
es:
  # Spring Boot 4 bundles the 9.x ES Java client, which cannot talk to an 8.x server.
  version: "9.2.8"
  java_opts: -Xms4g -Xmx4g -Dlog4j2.formatMsgNoLookups=true
  # Stop Karpenter (Auto Mode) from draining the ES pod's node during consolidation
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"
  resources:
    limits:
      cpu: 4
      memory: 8Gi
    requests:
      cpu: 1
      memory: 8Gi
  storage_class: gp3-retain
  storage: 1Gi

# ── KEDA — Jetty busy-thread ratio (Grafana Cloud) + CPU safety net (metrics-server) ──
# Threshold is derived from the observed production baseline: well above steady-state
# noise, low enough to fire before thread saturation. clusterName pins the query to
# this cluster's series so co-labeled metrics from other clusters can't skew the
# average. The CPU trigger scales via metrics-server, independent of Grafana Cloud.
keda:
  enabled: true
  prometheusAddress: https://prometheus-prod-32-prod-ca-east-0.grafana.net/api/prom
  clusterName: eks-production-openvsx
  minReplicas: 8
  # 15 caps fleet Hikari pools at 450 of RDS max_connections=500 (30/pod, pinned
  # open). Raise only after shrinking the pool size.
  maxReplicas: 15
  pollingInterval: 30
  cooldownPeriod: 600
  thresholdBusyRatio: "0.15"
  smoothingWindow: 3m
  cpuUtilization: 70
  scaleUp:
    stabilizationWindowSeconds: 60
    pods: 4
    periodSeconds: 60
  scaleDown:
    stabilizationWindowSeconds: 900
    pods: 1
    periodSeconds: 180

# ── External Secrets Operator — ESO + ClusterSecretStore via eks/helm.tf; secrets from TF secrets/ module ──
externalSecrets:
  enabled: true
  clusterSecretStore: aws-secrets-manager
  refreshInterval: 1h
  fastlyLogsBucket: "fastlyopenvsxorg"
  storageBucket: "openvsxorg"
  # Soft init — a pod builds the index only if missing. `true` made every pod start wipe the
  # shared index; freshness comes from incremental writes + the daily 04:00 UTC JobRunr job.
  # Hard rebuild on demand: POST /admin/update-search-index.
  elasticsearchClearOnStart: false

# ── Grafana Alloy — disabled; monitoring/ TF module manages Alloy cluster-wide with IRSA (OKD nodeSelector won't match EKS) ──
alloy:
  enabled: false

# ── ClamAV ───────────────────────────────────────────────────────────────────
clamav:
  enabled: true
  name: "clamav"
  replicas: 3
  persistence:
    storageClass: "gp3-retain"
  image:
    repository: "ghcr.io/eclipsefdn/clamav-rest-new"
    tag: "v0.1.2"
    pullPolicy: Always
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 4
      memory: 6Gi
  service:
    port: 9000
  env:
    MAX_UPLOAD_SIZE_MB: 512
    MAX_EXTRACTED_SIZE_MB: 512
    MAX_FILE_COUNT: 100000
    MAX_SINGLE_FILE_MB: 512
    MAX_RECURSION: 16
    MAX_THREADS: 10
    SCAN_TIMEOUT_MINUTES: 10

# ── YARA ─────────────────────────────────────────────────────────────────────
yara:
  enabled: true
  name: "yara"
  replicas: 1
  image:
    repository: "ghcr.io/eclipsefdn/yara-rest"
    tag: "v0.1.1"
    pullPolicy: Always
  resources:
    requests:
      cpu: 2
      memory: 2Gi
    limits:
      cpu: 4
      memory: 4Gi
  service:
    port: 9001
  env:
    MAX_UPLOAD_SIZE_MB: 512
    MAX_EXTRACTED_SIZE_MB: 1024
    MAX_FILE_COUNT: 100000
    MAX_SINGLE_FILE_MB: 512
    MAX_RECURSION: 16
    SCAN_TIMEOUT_MINUTES: 5
