# Default values for openvsx eks staging.

name: &name open-vsx-org
environment: &environment staging
platform: &platform eks
namespace: &namespace open-vsx-org-staging
host: staging.open-vsx.org

replicaCount: 6
esReplicaCount: 3

# Must exceed the ALB deregistration_delay of 30s set in ingress annotations below.
preStopDelaySeconds: 35

# Enables templates/hpa-postgresql.yaml — HPA on the in-cluster postgresql-ha
# StatefulSet (3..9 replicas, CPU 60%). aws-staging has postgresql-ha; aws-production
# uses RDS so this stays unset there.
autoscaling:
  enabled: true

keda:
  enabled: true
  clusterName: eks-staging-openvsx
  minReplicas: 2
  maxReplicas: 4
  thresholdBusyRatio: "0.5"
  prometheusAddress: "https://prometheus-prod-32-prod-ca-east-0.grafana.net/api/prom"
  pollingInterval: 30
  cooldownPeriod: 600
  scaleUp:
    stabilizationWindowSeconds: 180
    pods: 2
    periodSeconds: 120
  scaleDown:
    stabilizationWindowSeconds: 600
    pods: 1
    periodSeconds: 180

image:
  repository: ghcr.io/eclipsefdn/openvsx-website
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: 97e1417-99

eks:
  enabled: true  # Switch to false for OKD installations

# ── ServiceAccount (IRSA) — replaces the manual `default` SA + static AWS keys ──
serviceAccount:
  create: true
  name: openvsx
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::365555376529:role/openvsx-app-staging"

# ── External Secrets Operator — composes deployment-configuration-staging from SM ──
externalSecrets:
  enabled: true
  clusterSecretStore: aws-secrets-manager
  refreshInterval: 1h
  fastlyLogsBucket: "fastlyopenvsxorgstaging"
  storageBucket: "openvsxorgstaging"
  # Soft init — a pod builds the index only if missing. `true` made every pod start wipe the
  # shared index; freshness comes from incremental writes + the daily 04:00 UTC JobRunr job.
  # Hard rebuild on demand: POST /admin/update-search-index.
  elasticsearchClearOnStart: false
  # Read the ES elastic password straight from the ECK secret (deployment.yaml) instead of SM/ESO —
  # app comes up green on first deploy, no bootstrap script, self-heals on ECK password rotation.
  elasticsearchPasswordFromEck: true
  # In-cluster Postgres (no RDS in staging)
  inClusterPostgres: true
  postgresHost: "staging-postgresql-ha-postgresql"
  postgresDb: "openvsx-staging"
  postgresUsername: "postgres"

# Injects SPRING_DATASOURCE_PASSWORD from the Bitnami-generated postgresql-ha secret.
inClusterPostgres:
  passwordSecret:
    name: "staging-postgresql-ha-postgresql"
    key: "password"

# ── Logical Postgres backup ───────────────────────────────────────────────────
# The in-cluster postgresql-ha PVCs are gp3/reclaimPolicy=Delete with no EBS snapshots,
# so this dump is staging's only recovery point. Reuses the same ESO-pinned credential
# secret as the app (inClusterPostgres.passwordSecret above) — no second credential path.
# IRSA: dedicated write-only role (s3:PutObject + s3:AbortMultipartUpload on
# arn:aws:s3:::eclipse-openvsx-db-backups/staging/* only) — deliberately NOT an extra
# statement on openvsx-app-staging. The SA name is the IRSA trust subject, so it must
# stay equal to the one the role's trust policy names.
dbBackup:
  enabled: true
  s3:
    bucket: "eclipse-openvsx-db-backups"
    prefix: "staging"
    region: eu-central-1
  serviceAccount:
    create: true
    name: openvsx-pg-backup
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::365555376529:role/openvsx-pg-backup-staging"

serviceMonitors:
  platformMetrics:
    enabled: true

aws-load-balancer-controller:
  enabled: false

ingress:
  # false skips the Ingress and its ALB (e.g. a copy reached only by port-forward).
  enabled: true
  certArn: arn:aws:acm:eu-central-1:365555376529:certificate/b3835b51-0271-404d-8b35-31f14bd651cc
  preActions:
    - forward-cors
    - ssl-redirect
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:365555376529:certificate/b3835b51-0271-404d-8b35-31f14bd651cc
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: >
      {"Type": "redirect", "RedirectConfig":
       {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}
    alb.ingress.kubernetes.io/actions.forward-cors: >
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"204"}}
    alb.ingress.kubernetes.io/conditions.forward-cors: >
      [{"field":"http-request-method","httpRequestMethodConfig":{"values":["OPTIONS"]}}]
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-port: "8081"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60,routing.http2.enabled=true,deletion_protection.enabled=true,client_keep_alive.seconds=60
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30,slow_start.duration_seconds=0

website:
  jvmArgs: >
    -Xms4G -Xmx6G
    -XX:+AlwaysPreTouch
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+UseStringDeduplication
    -XX:+ParallelRefProcEnabled
    -XX:+DisableExplicitGC
    -XX:+UnlockExperimentalVMOptions
    -XX:+UnlockDiagnosticVMOptions
    -XX:-OmitStackTraceInFastThrow
    -Dlog4j2.formatMsgNoLookups=true
    -Dlog4j.formatMsgNoLookups=true
    -Dorg.jooq.no-logo=true
    -Dorg.jooq.no-tips=true
    --enable-native-access=ALL-UNNAMED

resources:
  limits:
    cpu: 5000m
    memory: 8Gi
  requests:
    cpu: 3000m
    memory: 8Gi

# elastic search
es:
  # Spring Boot 4 bundles the 9.x ES Java client, which cannot talk to an 8.x server.
  version: "9.2.8"
  podAnnotations:
    "karpenter.sh/do-not-disrupt": "true"
    "cluster-autoscaler.kubernetes.io/safe-to-evict": "false"
  java_opts: -Xms1g -Xmx1g -Dlog4j2.formatMsgNoLookups=true
  resources:
    limits:
      cpu: 4
      memory: 8Gi
    requests:
      cpu: 1
      memory: 8Gi
  storage_class: gp3
  storage: 4Gi

postgresql-ha:
  enabled: true
  # Root init container pre-creates /bitnami/postgresql/conf owned by 1001 before the conf.d submount.
  # On fresh volumes fsGroup misses that kubelet-created parent dir → postgres permission-denied crashloop.
  volumePermissions:
    enabled: true
    image:
      repository: bitnamilegacy/os-shell  # public bitnami/os-shell is retired
      tag: 12-debian-12-r51
  metrics:
    enabled: true
    image:
      repository: bitnamilegacy/postgres-exporter
      tag: 0.17.1-debian-12-r14
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    serviceMonitor:
      enabled: true
      interval: 60s
      labels:
        app: open-vsx-org
        environment: staging
  postgresql:
    # Pinned to SM via ESO (templates/external-secrets.yaml) — stops the --atomic
    # uninstall password-regeneration loop. Keys: password, repmgr-password.
    existingSecret: staging-postgresql-ha-postgresql
    image:
      repository: bitnamilegacy/postgresql-repmgr
      tag: 17.6.0-debian-12-r2
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
    database: openvsx-staging
    createDatabase: true
    passwordEncryption: "scram-sha-256"
    enablePostgresUser: true
    extraEnvVars:
      - name: POSTGRESQL_SR_CHECK_PASSWORD
    authenticationConfiguration: |
      host all all 0.0.0.0/0 scram-sha-256
      local all all peer
    extendedConf: |-
      max_connections = 1000
      # Reduced to ~20% of RAM to leave room for connection overhead
      shared_buffers = 800MB
      # Critical: Set low because it can be allocated multiple times per query
      work_mem = 1MB
      # Lowered to avoid spikes during maintenance
      maintenance_work_mem = 64MB
      # 50-75% of total RAM is the standard planner hint
      effective_cache_size = 3000MB
    resources:
      requests:
        cpu: "500m"
        memory: "3Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    pdb:
      create: true
      minAvailable: 1
    podAnnotations:
      "karpenter.sh/do-not-disrupt": "true"
      "cluster-autoscaler.kubernetes.io/safe-to-evict": "false"
  pgpool:
    replicaCount: 0
    # sr-check-password is mounted on the postgresql pods even at replicaCount 0; pin it too.
    # Keys: admin-password, sr-check-password.
    existingSecret: staging-postgresql-ha-pgpool

# grafana alloy
alloy:
  enabled: false

clamav:
  enabled: true
  name: "clamav"
  replicas: 3
  persistence:
    storageClass: "gp3"
  image:
    repository: "ghcr.io/eclipsefdn/clamav-rest-new"
    tag: "v0.1.2"
    pullPolicy: Always
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 4
      memory: 6Gi
  service:
    port: 9000
  env:
    MAX_UPLOAD_SIZE_MB: 1024
    MAX_EXTRACTED_SIZE_MB: 2048
    MAX_FILE_COUNT: 100000
    MAX_SINGLE_FILE_MB: 512
    MAX_RECURSION: 16
    MAX_THREADS: 4
    SCAN_TIMEOUT_MINUTES: 5
    # clamav-rest's own HTTP server closes the connection once this elapses, independent of
    # the scan itself or any client-side timeout; it must stay comfortably above SCAN_TIMEOUT_MINUTES
    # or a slow scan gets cut off mid-flight and its result is lost even though scanning keeps running.
    WRITE_TIMEOUT_SECONDS: 360

# Analytics — extension download/usage analytics, stored in the CloudNativePG cluster
# (analyticsCnpg below). App-side wiring (ovsx.analytics.* datasource) lives in
# external-secrets.yaml/deployment.yaml. The app keeps serving while this database is
# unreachable and catches up on analytics afterwards. database/username are used by the
# CNPG bootstrap. Rotating the password is not just a Secrets Manager edit — see
# "Rotating the analytics database password" in kubernetes/README.md.
analytics:
  enabled: true
  database: openvsx_analytics
  username: admin

# Analytics on CloudNativePG; the app uses it (analytics block above). Role and bucket
# come from tf-resources (staging iam/ and s3/).
analyticsCnpg:
  enabled: true
  instances: 2
  # Maintained by Timescale and includes the TSL features the app uses. Pinned by digest;
  # bump on each Timescale release, as fixed tags are never rebuilt.
  postgresMajor: 17
  image: "timescale/timescaledb-ha:pg17.11-ts2.30.2@sha256:20534b8a06680956336604f3735d5811807f5244c6a364c761a70dea9c63de36"
  backupRoleArn: "arn:aws:iam::365555376529:role/openvsx-analytics-backup-staging"
  storage:
    size: 10Gi
    storageClass: gp3
  # Sized for bulk loads (restores, backfills), which write roughly the data size in WAL.
  walStorage:
    size: 10Gi
    storageClass: gp3
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  # Sized for the 2Gi memory limit above and EBS SSD storage; CNPG defaults assume more memory
  # and spinning disks. Revisit together with resources.
  parameters:
    shared_buffers: 256MB
    effective_cache_size: 768MB
    work_mem: 16MB
    maintenance_work_mem: 128MB
    random_page_cost: "1.1"
  backup:
    destinationPath: "s3://openvsx-analytics-backups-staging/"
    retentionPolicy: "30d"
    # CNPG cron has a leading seconds field.
    schedule: "0 0 3 * * *"

yara:
  enabled: true
  name: "yara"
  replicas: 1
  image:
    repository: "ghcr.io/eclipsefdn/yara-rest"
    tag: "v0.1.2"
    pullPolicy: Always
  resources:
    requests:
      cpu: 1
      memory: 4Gi
    limits:
      cpu: 2
      memory: 4Gi
  service:
    port: 9001
  env:
    MAX_UPLOAD_SIZE_MB: 1024
    MAX_EXTRACTED_SIZE_MB: 2048
    MAX_FILE_COUNT: 100000
    MAX_SINGLE_FILE_MB: 512
    MAX_RECURSION: 0
    SCAN_TIMEOUT_MINUTES: 5
    HTTP_READ_TIMEOUT_SECONDS: 120
    HTTP_WRITE_TIMEOUT_SECONDS: 600
