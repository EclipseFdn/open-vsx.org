# Default values for openvsx eks staging.

name: &name open-vsx-org
environment: &environment staging
platform: &platform eks
namespace: &namespace open-vsx-org-staging
host: staging.open-vsx.org

replicaCount: 6
esReplicaCount: 3

# Enables templates/hpa-postgresql.yaml — HPA on the in-cluster postgresql-ha
# StatefulSet (3..9 replicas, CPU 60%). aws-staging has postgresql-ha; aws-production
# uses RDS so this stays unset there.
autoscaling:
  enabled: true

keda:
  enabled: true
  clusterName: eks-staging-openvsx
  minReplicas: 2
  maxReplicas: 4
  thresholdBusyRatio: "0.5"
  prometheusAddress: "https://prometheus-prod-32-prod-ca-east-0.grafana.net/api/prom"
  pollingInterval: 30
  cooldownPeriod: 600
  scaleUp:
    stabilizationWindowSeconds: 180
    pods: 2
    periodSeconds: 120
  scaleDown:
    stabilizationWindowSeconds: 600
    pods: 1
    periodSeconds: 180

image:
  repository: ghcr.io/eclipsefdn/openvsx-website
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: 97e1417-99

eks:
  enabled: true  # Switch to false for OKD installations

# ── ServiceAccount (IRSA) — replaces the manual `default` SA + static AWS keys ──
serviceAccount:
  create: true
  name: openvsx
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::365555376529:role/openvsx-app-staging"

# ── External Secrets Operator — composes deployment-configuration-staging from SM ──
externalSecrets:
  enabled: true
  clusterSecretStore: aws-secrets-manager
  refreshInterval: 1h
  fastlyLogsBucket: "fastlyopenvsxorgstaging"
  storageBucket: "openvsxorgstaging"
  # Soft init — a pod builds the index only if missing. `true` made every pod start wipe the
  # shared index; freshness comes from incremental writes + the daily 04:00 UTC JobRunr job.
  # Hard rebuild on demand: POST /admin/update-search-index.
  elasticsearchClearOnStart: false
  # Read the ES elastic password straight from the ECK secret (deployment.yaml) instead of SM/ESO —
  # app comes up green on first deploy, no bootstrap script, self-heals on ECK password rotation.
  elasticsearchPasswordFromEck: true
  # In-cluster Postgres (no RDS in staging)
  inClusterPostgres: true
  postgresHost: "staging-postgresql-ha-postgresql"
  postgresDb: "openvsx-staging"
  postgresUsername: "postgres"

# Injects SPRING_DATASOURCE_PASSWORD from the Bitnami-generated postgresql-ha secret.
inClusterPostgres:
  passwordSecret:
    name: "staging-postgresql-ha-postgresql"
    key: "password"

serviceMonitors:
  platformMetrics:
    enabled: true

aws-load-balancer-controller:
  enabled: false

ingress:
  certArn: arn:aws:acm:eu-central-1:365555376529:certificate/c247a8c7-31fa-4116-bd4a-c1e5aebad840
  preActions:
    - forward-cors
    - ssl-redirect
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:365555376529:certificate/c247a8c7-31fa-4116-bd4a-c1e5aebad840
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: >
      {"Type": "redirect", "RedirectConfig":
       {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}
    alb.ingress.kubernetes.io/actions.forward-cors: >
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"204"}}
    alb.ingress.kubernetes.io/conditions.forward-cors: >
      [{"field":"http-request-method","httpRequestMethodConfig":{"values":["OPTIONS"]}}]
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-port: "8081"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60,routing.http2.enabled=true,deletion_protection.enabled=true,client_keep_alive.seconds=60
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30,slow_start.duration_seconds=0

website:
  jvmArgs: >
    -Xms4G -Xmx6G
    -XX:+AlwaysPreTouch
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+UseStringDeduplication
    -XX:+ParallelRefProcEnabled
    -XX:+DisableExplicitGC
    -XX:+UnlockExperimentalVMOptions
    -XX:+UnlockDiagnosticVMOptions
    -XX:-OmitStackTraceInFastThrow
    -Dlog4j2.formatMsgNoLookups=true
    -Dlog4j.formatMsgNoLookups=true
    -Dorg.jooq.no-logo=true
    -Dorg.jooq.no-tips=true
    --enable-native-access=ALL-UNNAMED

resources:
  limits:
    cpu: 5000m
    memory: 8Gi
  requests:
    cpu: 3000m
    memory: 8Gi

# elastic search
es:
  # Spring Boot 4 bundles the 9.x ES Java client, which cannot talk to an 8.x server.
  version: "9.2.8"
  podAnnotations:
    "karpenter.sh/do-not-disrupt": "true"
    "cluster-autoscaler.kubernetes.io/safe-to-evict": "false"
  java_opts: -Xms1g -Xmx1g -Dlog4j2.formatMsgNoLookups=true
  resources:
    limits:
      cpu: 4
      memory: 8Gi
    requests:
      cpu: 1
      memory: 8Gi
  storage_class: gp3
  storage: 4Gi

postgresql-ha:
  enabled: true
  # Root init container pre-creates /bitnami/postgresql/conf owned by 1001 before the conf.d submount.
  # On fresh volumes fsGroup misses that kubelet-created parent dir → postgres permission-denied crashloop.
  volumePermissions:
    enabled: true
    image:
      repository: bitnamilegacy/os-shell  # public bitnami/os-shell is retired
      tag: 12-debian-12-r51
  metrics:
    enabled: true
    image:
      repository: bitnamilegacy/postgres-exporter
      tag: 0.17.1-debian-12-r14
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    serviceMonitor:
      enabled: true
      interval: 60s
      labels:
        app: open-vsx-org
        environment: staging
  postgresql:
    # Pinned to SM via ESO (templates/external-secrets.yaml) — stops the --atomic
    # uninstall password-regeneration loop. Keys: password, repmgr-password.
    existingSecret: staging-postgresql-ha-postgresql
    image:
      repository: bitnamilegacy/postgresql-repmgr
      tag: 17.6.0-debian-12-r2
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
    database: openvsx-staging
    createDatabase: true
    passwordEncryption: "scram-sha-256"
    enablePostgresUser: true
    extraEnvVars:
      - name: POSTGRESQL_SR_CHECK_PASSWORD
    authenticationConfiguration: |
      host all all 0.0.0.0/0 scram-sha-256
      local all all peer
    extendedConf: |-
      max_connections = 1000
      # Reduced to ~20% of RAM to leave room for connection overhead
      shared_buffers = 800MB
      # Critical: Set low because it can be allocated multiple times per query
      work_mem = 1MB
      # Lowered to avoid spikes during maintenance
      maintenance_work_mem = 64MB
      # 50-75% of total RAM is the standard planner hint
      effective_cache_size = 3000MB
    resources:
      requests:
        cpu: "500m"
        memory: "3Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    pdb:
      create: true
      minAvailable: 1
    podAnnotations:
      "karpenter.sh/do-not-disrupt": "true"
      "cluster-autoscaler.kubernetes.io/safe-to-evict": "false"
  pgpool:
    replicaCount: 0
    # sr-check-password is mounted on the postgresql pods even at replicaCount 0; pin it too.
    # Keys: admin-password, sr-check-password.
    existingSecret: staging-postgresql-ha-pgpool

# grafana alloy
alloy:
  enabled: false

clamav:
  enabled: true
  name: "clamav"
  replicas: 3
  persistence:
    storageClass: "gp3"
  image:
    repository: "ghcr.io/eclipsefdn/clamav-rest-new"
    tag: "v0.1.2"
    pullPolicy: Always
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 4
      memory: 6Gi
  service:
    port: 9000
  env:
    MAX_UPLOAD_SIZE_MB: 512
    MAX_EXTRACTED_SIZE_MB: 512
    MAX_FILE_COUNT: 100000
    MAX_SINGLE_FILE_MB: 300
    MAX_RECURSION: 16
    MAX_THREADS: 4
    SCAN_TIMEOUT_MINUTES: 5

yara:
  enabled: true
  name: "yara"
  replicas: 1
  image:
    repository: "ghcr.io/eclipsefdn/yara-rest"
    tag: "v0.1.1"
    pullPolicy: Always
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi
  service:
    port: 9001
  env:
    MAX_UPLOAD_SIZE_MB: 512
    MAX_EXTRACTED_SIZE_MB: 1024
    MAX_FILE_COUNT: 100000
    MAX_SINGLE_FILE_MB: 300
    MAX_RECURSION: 0
    SCAN_TIMEOUT_MINUTES: 5
