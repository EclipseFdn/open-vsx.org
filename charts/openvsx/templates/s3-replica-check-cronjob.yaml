{{- if (.Values.s3ReplicaCheck).enabled }}
{{- if not .Values.eks.enabled }}
{{- fail "s3ReplicaCheck.enabled requires eks.enabled — it reads S3 through IRSA." }}
{{- end }}
{{- $c := .Values.s3ReplicaCheck }}
{{- $cmName := printf "%s-s3-replica-check-%s" .Values.name .Values.environment }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $c.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    environment: {{ .Values.environment }}
    type: s3-replica-check
  {{- with $c.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Daily proof that the cross-region copy of the content bucket is complete.
#
# Compares the latest S3 Inventory of the source bucket with that of its replica: every
# source file older than the comparison cutoff must exist in the replica with the same size
# and ETag, and none may be FAILED or stuck PENDING. Replica-only files are counted as `extra`.
# A small random sample is then read from both sides and compared by sha256. Read-only; the
# outcome is pushed to Loki for alerting.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}-s3-replica-check-{{ .Values.environment }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    environment: {{ .Values.environment }}
    type: s3-replica-check
spec:
  schedule: {{ $c.schedule | quote }}
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 0: every attempt reports to Loki, so a retry would alert on a failure it then fixes.
      # Transient errors are retried inside the script instead.
      backoffLimit: 0
      activeDeadlineSeconds: {{ $c.activeDeadlineSeconds | int64 }}
      template:
        metadata:
          labels:
            app: {{ .Values.name }}
            environment: {{ .Values.environment }}
            type: s3-replica-check
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $c.serviceAccount.name }}
          containers:
          - name: s3-replica-check
            image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
            imagePullPolicy: IfNotPresent
            env:
            - name: SOURCE_BUCKET
              value: {{ $c.source.bucket | quote }}
            - name: SOURCE_REGION
              value: {{ $c.source.region | quote }}
            - name: SOURCE_INVENTORY_BUCKET
              value: {{ $c.source.inventoryBucket | quote }}
            - name: REPLICA_BUCKET
              value: {{ $c.replica.bucket | quote }}
            - name: REPLICA_REGION
              value: {{ $c.replica.region | quote }}
            - name: REPLICA_INVENTORY_BUCKET
              value: {{ $c.replica.inventoryBucket | quote }}
            - name: INVENTORY_NAME
              value: {{ $c.inventoryName | quote }}
            - name: INVENTORY_PREFIX
              value: {{ $c.inventoryPrefix | quote }}
            # int64: YAML numbers are float64 and `quote` renders >=1e6 in scientific notation.
            - name: CUTOFF_HOURS
              value: {{ $c.cutoffHours | int64 | quote }}
            - name: MAX_INVENTORY_AGE_H
              value: {{ $c.maxInventoryAgeHours | int64 | quote }}
            - name: MIN_SOURCE_OBJECTS
              value: {{ $c.minSourceObjects | int64 | quote }}
            - name: SAMPLE_SIZE
              value: {{ $c.sampleSize | int64 | quote }}
            - name: SAMPLE_MAX_BYTES
              value: {{ $c.sampleMaxBytes | int64 | quote }}
            - name: WARMUP_UNTIL
              value: {{ $c.warmupUntil | quote }}
            - name: REPORT_TO_LOKI
              value: {{ $c.reportToLoki | quote }}
            - name: AWS_RETRY_MODE
              value: "adaptive"
            - name: AWS_MAX_ATTEMPTS
              value: "10"
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: K8S_NAMESPACE
              value: {{ .Values.namespace | quote }}
            envFrom:
            # LOKI_URL / LOKI_USERNAME / LOKI_PASSWORD — outcome reporting.
            - secretRef:
                name: grafana-cloud-secret-{{ .Values.environment }}
            resources:
              {{- toYaml $c.resources | nindent 14 }}
            volumeMounts:
            - name: work
              mountPath: /work
            - name: script
              mountPath: /scripts
            command: ["/bin/sh", "/scripts/check.sh"]
          volumes:
          - name: work
            emptyDir:
              sizeLimit: {{ $c.scratchSize }}
          - name: script
            configMap:
              name: {{ $cmName }}
              defaultMode: 0555
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cmName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    environment: {{ .Values.environment }}
    type: s3-replica-check
data:
  check.sh: |
    #!/bin/sh
    set -u
    cd /work

    JOB=openvsx-s3-replica-check
    STARTED_EPOCH=$(date -u +%s)
    STATUS=failed; STAGE=start; REASON=""
    SRC_INV=""; DST_INV=""; SRC_OBJECTS=0; CHECKED=0
    MISSING=0; MISMATCH=0; FAILED_REPL=0; STALE_PENDING=0; SAMPLE_OK=0; SAMPLE_BAD=0; FOUND=0; EXTRA=0
    TAB=$(printf '\t')

    push_loki() {
      [ "${REPORT_TO_LOKI}" = "true" ] || return 0
      [ -n "${LOKI_URL:-}" ] || return 0
      AUTH=$(printf '%s:%s' "${LOKI_USERNAME}" "${LOKI_PASSWORD}" | base64 | tr -d '\n')
      NOW_NS="$(date -u +%s)000000000"
      BODY='{"streams":[{"stream":{"job":"'"${JOB}"'","namespace":"'"${K8S_NAMESPACE}"'","environment":"'"${ENVIRONMENT}"'","status":"'"$1"'"},"values":[["'"${NOW_NS}"'","'"$2"'"]]}]}'
      wget -q -O /dev/null --header="Content-Type: application/json" \
        --header="Authorization: Basic ${AUTH}" --post-data="${BODY}" "${LOKI_URL}" \
        || echo "WARN: loki push failed (outcome above is authoritative)"
    }

    # `problems` is what the alert reads. During warm-up (initial backfill, first inventories)
    # it is forced to 0 so expected gaps do not page; `found` always carries the real count.
    report() {
      rc=$?
      [ "$rc" -ne 0 ] && [ -z "${REASON}" ] && REASON="exit-${rc}"
      PROBLEMS=${FOUND}
      [ "${STATUS}" = "failed" ] && [ "${PROBLEMS}" -eq 0 ] && PROBLEMS=1
      if [ "${STATUS}" = "failed" ] && [ "$(date -u +%Y%m%d)" -lt "$(echo "${WARMUP_UNTIL}" | tr -d '-')" ]; then
        STATUS=warming; PROBLEMS=0; rc=0
      fi
      DURATION=$(( $(date -u +%s) - STARTED_EPOCH ))
      LINE="job=${JOB} env=${ENVIRONMENT} status=${STATUS} problems=${PROBLEMS} found=${FOUND} stage=${STAGE} duration_s=${DURATION} source_inventory=${SRC_INV} replica_inventory=${DST_INV} source_objects=${SRC_OBJECTS} checked=${CHECKED} missing=${MISSING} mismatch=${MISMATCH} failed_replication=${FAILED_REPL} stale_pending=${STALE_PENDING} extra=${EXTRA} sample_ok=${SAMPLE_OK} sample_bad=${SAMPLE_BAD} warmup_until=${WARMUP_UNTIL} reason=${REASON:-none}"
      echo "${LINE}"
      push_loki "${STATUS}" "${LINE}"
      exit "$rc"
    }
    trap report EXIT

    fail() { REASON="$1"; exit 1; }

    STAGE=tooling
    i=0
    until apk add --no-cache aws-cli coreutils jq >/dev/null 2>&1; do
      i=$((i+1)); [ "$i" -ge 3 ] && fail "apk-install-failed"; sleep 20
    done

    # Newest inventory whose manifest.checksum exists (it is written last, after the data).
    latest_inventory() { # $1 inventory bucket, $2 listed bucket, $3 region
      base="s3://$1/${INVENTORY_PREFIX}/$2/${INVENTORY_NAME}/"
      aws s3 ls "${base}" --region "$3" 2>/dev/null | awk '$1=="PRE"{print $2}' \
        | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}Z/$' | sort -r \
        | while read -r d; do
            if aws s3 ls "${base}${d}manifest.checksum" --region "$3" >/dev/null 2>&1; then
              echo "${d%/}"; break
            fi
          done
    }

    # Emits key<TAB>size<TAB>etag<TAB>replication_status<TAB>last_modified per object.
    # Inventory CSV quotes every field, and keys are URL-encoded, so '","' is a safe separator.
    extract() { # $1 inventory bucket, $2 listed bucket, $3 region, $4 dated folder
      base="s3://$1/${INVENTORY_PREFIX}/$2/${INVENTORY_NAME}/$4"
      aws s3 cp "${base}/manifest.json" "m-$2.json" --region "$3" --only-show-errors || return 1
      schema=$(jq -r '.fileSchema' "m-$2.json")
      jq -r '.files[].key' "m-$2.json" | while read -r k; do
        aws s3 cp "s3://$1/$k" - --region "$3" --only-show-errors | gzip -dc || { echo "EXTRACT_FAILED"; return 1; }
      done | awk -v schema="${schema}" 'BEGIN {
          n = split(schema, f, /, */)
          for (i = 1; i <= n; i++) col[f[i]] = i
        }
        /^EXTRACT_FAILED$/ { exit 3 }
        {
          line = substr($0, 2, length($0) - 2)
          split(line, v, /","/)
          printf "%s\t%s\t%s\t%s\t%s\n", v[col["Key"]], v[col["Size"]], v[col["ETag"]], v[col["ReplicationStatus"]], v[col["LastModifiedDate"]]
        }'
    }

    inv_epoch() { # 2026-09-28T01-00Z -> epoch
      date -u -d "$(echo "$1" | sed -E 's/T([0-9]{2})-([0-9]{2})Z/ \1:\2/')" +%s
    }

    STAGE=find-inventory
    SRC_INV=$(latest_inventory "${SOURCE_INVENTORY_BUCKET}" "${SOURCE_BUCKET}" "${SOURCE_REGION}")
    DST_INV=$(latest_inventory "${REPLICA_INVENTORY_BUCKET}" "${REPLICA_BUCKET}" "${REPLICA_REGION}")
    [ -n "${SRC_INV}" ] && [ -n "${DST_INV}" ] || fail "no-inventory-yet"

    NOW=$(date -u +%s)
    SRC_T=$(inv_epoch "${SRC_INV}"); DST_T=$(inv_epoch "${DST_INV}")
    OLDEST=$(( SRC_T < DST_T ? SRC_T : DST_T ))
    [ $(( (NOW - OLDEST) / 3600 )) -le "${MAX_INVENTORY_AGE_H}" ] || fail "inventory-stale"

    # The two listings are taken at different moments, and replication is asynchronous, so only
    # files last modified well before the older listing are compared.
    CUTOFF=$(date -u -d "@$(( OLDEST - CUTOFF_HOURS * 3600 ))" +%Y-%m-%dT%H:%M:%S.000Z)

    STAGE=extract
    extract "${SOURCE_INVENTORY_BUCKET}" "${SOURCE_BUCKET}" "${SOURCE_REGION}" "${SRC_INV}" > src.all || fail "source-inventory-unreadable"
    extract "${REPLICA_INVENTORY_BUCKET}" "${REPLICA_BUCKET}" "${REPLICA_REGION}" "${DST_INV}" > dst.all || fail "replica-inventory-unreadable"

    SRC_OBJECTS=$(wc -l < src.all)
    # An empty or truncated listing would otherwise report "0 missing" and pass.
    [ "${SRC_OBJECTS}" -ge "${MIN_SOURCE_OBJECTS}" ] || fail "source-inventory-too-small"

    STAGE=compare
    export LC_ALL=C
    awk -F'\t' -v c="${CUTOFF}" '$5 < c' src.all > src.checked
    CHECKED=$(wc -l < src.checked)
    FAILED_REPL=$(awk -F'\t' '$4 == "FAILED"' src.checked | wc -l)
    STALE_PENDING=$(awk -F'\t' '$4 == "PENDING"' src.checked | wc -l)

    awk -F'\t' '$4 != "FAILED" && $4 != "PENDING" {print $1"\t"$2"\t"$3}' src.checked \
      | sort -t "${TAB}" -k1,1 -S 256M -T /work > src.expect
    cut -f1-3 dst.all | sort -t "${TAB}" -k1,1 -S 256M -T /work > dst.sorted

    # Files only in the replica. Deletes are replicated, so this should be near 0; a file
    # deleted between the two listings shows here briefly. Informational — not in `found`.
    cut -f1 src.all | sort -S 256M -T /work > src.keys
    EXTRA=$(cut -f1 dst.sorted | comm -13 src.keys - | wc -l)
    rm -f src.all dst.all src.checked src.keys

    MISSING=$(join -t "${TAB}" -v1 -o 1.1 src.expect dst.sorted | wc -l)
    # Replication copies the object unchanged, so the replica keeps the source's size and ETag.
    join -t "${TAB}" -o 1.1,1.2,1.3,2.2,2.3 src.expect dst.sorted > joined
    # ""-concatenation forces string comparison: an all-digit or "...1e8480" ETag would
    # otherwise compare as a number.
    MISMATCH=$(awk -F'\t' '($2 "") != ($4 "") || ($3 "") != ($5 "")' joined | wc -l)

    STAGE=sample
    # Inventory keys are form-encoded ('+' = space). `env printf` is coreutils, which handles \xHH.
    decode() { env printf '%b' "$(printf '%s' "$1" | sed -e 's/+/ /g' -e 's/%\([0-9A-Fa-f][0-9A-Fa-f]\)/\\x\1/g')"; }
    awk -F'\t' -v m="${SAMPLE_MAX_BYTES}" '($2 "") == ($4 "") && ($3 "") == ($5 "") && $2 > 0 && $2 <= m {print $1}' joined \
      | shuf -n "${SAMPLE_SIZE}" > sample
    rm -f joined
    while read -r enc; do
      key=$(decode "${enc}")
      a=$(aws s3 cp "s3://${SOURCE_BUCKET}/${key}" - --region "${SOURCE_REGION}" --only-show-errors | sha256sum | cut -d' ' -f1)
      b=$(aws s3 cp "s3://${REPLICA_BUCKET}/${key}" - --region "${REPLICA_REGION}" --only-show-errors | sha256sum | cut -d' ' -f1)
      if [ "$a" = "$b" ] && [ "$a" != "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
        SAMPLE_OK=$((SAMPLE_OK+1))
      else
        SAMPLE_BAD=$((SAMPLE_BAD+1)); echo "sample mismatch: ${key}"
      fi
    done < sample

    STAGE=done
    FOUND=$(( MISSING + MISMATCH + FAILED_REPL + STALE_PENDING + SAMPLE_BAD ))
    if [ "${FOUND}" -eq 0 ]; then STATUS=ok; else REASON="replica-incomplete"; exit 1; fi
{{- end }}
