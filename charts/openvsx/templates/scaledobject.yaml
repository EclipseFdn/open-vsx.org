{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.name }}-{{ .Values.platform }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    name: {{ .Values.name }}-{{ .Values.environment }}
  minReplicaCount: {{ .Values.keda.minReplicas }}
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  pollingInterval: {{ .Values.keda.pollingInterval | default 30 }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod | default 600 }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: {{ .Values.keda.scaleUp.stabilizationWindowSeconds | default 180 }}
          policies:
            - type: Pods
              value: {{ .Values.keda.scaleUp.pods | default 2 }}
              periodSeconds: {{ .Values.keda.scaleUp.periodSeconds | default 120 }}
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.keda.scaleDown.stabilizationWindowSeconds | default 600 }}
          policies:
            - type: Pods
              value: {{ .Values.keda.scaleDown.pods | default 1 }}
              periodSeconds: {{ .Values.keda.scaleDown.periodSeconds | default 180 }}
  triggers:
  # Single signal: avg pod busy/max ratio, smoothed over 5m. Self-normalizing
  # across jetty.threads.max changes — threshold stays valid at any cap.
  # Filter on the environment label (set by management.metrics.tags) so this
  # survives Alloy scrape-config changes that may or may not inject namespace.
  - type: prometheus
    metadata:
      serverAddress: {{ .Values.keda.prometheusAddress }}
      metricName: jetty_threads_busy_ratio
      threshold: "{{ .Values.keda.thresholdBusyRatio | default "0.75" }}"
      query: |
        avg(
          avg_over_time(
            (
              jetty_threads_busy{environment="{{ .Values.environment }}",application="openvsx-server"}
              /
              jetty_threads_config_max{environment="{{ .Values.environment }}",application="openvsx-server"}
            )[5m:15s]
          )
        )
      authModes: "basic"
    authenticationRef:
      name: {{ .Values.name }}-grafana-cloud-auth
{{- end }}
