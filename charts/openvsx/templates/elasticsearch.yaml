apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  labels:
    app: {{ .Values.name }}
    environment: {{ .Values.environment }}
  name: elasticsearch-{{ .Values.environment }}
  namespace: {{ .Values.namespace }}
spec:
  {{- if .Values.eks.enabled }}
  # Disable ECK's auto-created PDB so templates/pdb.yaml is the single source of truth.
  # An empty object explicitly tells the ECK operator "do not manage a PDB for me."
  # On OKD this stays unset → ECK creates its default PDB (maxUnavailable: 1).
  podDisruptionBudget: {}
  {{- end }}
  nodeSets:
  - name: default
    count: {{ .Values.esReplicaCount }}
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.es.storage }}
        storageClassName: {{ .Values.es.storage_class }}
    config:
      node.roles:
      - master
      - data
      node.store.allow_mmap: false
    podTemplate:
      metadata:
        labels:
          app: {{ .Values.name }}
          environment: {{ .Values.environment }}
      spec:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    elasticsearch.k8s.elastic.co/cluster-name: elasticsearch-{{ .Values.environment }}
                topologyKey: kubernetes.io/hostname
              weight: 100
        containers:
        - env:
          - name: ES_JAVA_OPTS
            value: {{ .Values.es.java_opts }}
          name: elasticsearch
          resources:
          {{- toYaml .Values.es.resources | nindent 12 }}
  version: 8.18.8
