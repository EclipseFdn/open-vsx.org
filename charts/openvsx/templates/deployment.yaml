apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Values.name }}
    environment: {{ .Values.environment }}
  name: {{ .Values.name }}-{{ .Values.environment }}
  namespace: {{ .Values.namespace }}
spec:
  progressDeadlineSeconds: 900
  revisionHistoryLimit: 3
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app: {{ .Values.name }}
      environment: {{ .Values.environment }}
      type: website
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        environment: {{ .Values.environment }}
        type: website
    spec:
      terminationGracePeriodSeconds: 75
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
      - name: {{ .Values.name }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: http-management
          containerPort: 8081
          protocol: TCP
        env:
        - name: DEPLOYMENT_CONFIG
          value: /run/secrets/open-vsx.org/deployment/configuration.yml
        - name: ENVNAME
          value: {{ .Values.environment }}
        - name: JVM_ARGS
          value: {{ .Values.website.jvmArgs }}
        {{- if .Values.eks.enabled }}
        # EKS: route Loki4jAppender push through cluster-wide Alloy in monitoring ns
        # (chart Alloy is disabled — see values-aws.yaml). Overrides LOKI_URL from envFrom.
        - name: LOKI_URL
          value: "http://grafana-alloy.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        {{- end }}
        volumeMounts:
        - name: deployment-configuration
          mountPath: /run/secrets/open-vsx.org/deployment
        - name: truststore-with-elasticsearch-certs
          mountPath: /run/secrets/open-vsx.org/truststore
        envFrom:
        - secretRef:
            name: grafana-cloud-secret-{{ .Values.environment }}
        {{- if not .Values.eks.enabled }}
        - secretRef:
            name: deployment-configuration-{{ .Values.environment }}-aws
        {{- end }}
        - secretRef:
            name: deployment-configuration-{{ .Values.environment }}-argus
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 25"]
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: http-management
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /actuator/health/readiness
            port: http-management
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /actuator/health/readiness
            port: http-management
          periodSeconds: 10
          initialDelaySeconds: 30
          timeoutSeconds: 5
      initContainers:
      - command:
        - sh
        - -c
        - keytool -import -noprompt -alias es-http-certs-internal -file /run/secrets/elasticsearch/http-certs/ca.crt -storetype jks -storepass 'changeit' -keystore /run/secrets/open-vsx.org/truststore/elasticsearch-http-certs.keystore
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        name: init-keystore
        volumeMounts:
        - mountPath: /run/secrets/elasticsearch/http-certs
          name: elastic-internal-http-certificates
        - mountPath: /run/secrets/open-vsx.org/truststore
          name: truststore-with-elasticsearch-certs
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: open-vsx-org
            environment: {{ .Values.environment }}
        maxSkew: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      volumes:
      - name: deployment-configuration
        secret:
          defaultMode: 420
          optional: false
          secretName: deployment-configuration-{{ .Values.environment }}
      - name: elastic-internal-http-certificates
        secret:
          defaultMode: 420
          optional: false
          secretName: elasticsearch-{{ .Values.environment }}-es-http-certs-internal
      - name: truststore-with-elasticsearch-certs
        emptyDir:
          medium: Memory
