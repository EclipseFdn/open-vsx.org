{{- if .Values.analytics.enabled }}
# Projected into the timescaledb-single StatefulSet via its `postInit` list (see
# values-aws-staging.yaml). Runs once, right after Patroni initializes the cluster —
# creates the dedicated analytics database/role and enables the TimescaleDB extension
# in it (the chart's own post_init.sh only does this for `template1`/`postgres`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.environment }}-analytics-timescaledb-init
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    environment: {{ .Values.environment }}
data:
  01-create-analytics-database.sql: |
    \connect postgres
    SET synchronous_commit to 'off';
    SELECT 'CREATE DATABASE {{ .Values.analytics.database }} OWNER {{ .Values.analytics.username }}'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ .Values.analytics.database }}')\gexec

    \connect {{ .Values.analytics.database }}
    SET synchronous_commit to 'off';
    CREATE EXTENSION IF NOT EXISTS timescaledb;
{{- end }}
