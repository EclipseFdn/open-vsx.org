{{- if .Values.eks.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-{{ .Values.environment }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  rules:
  - host: {{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.ingress.preActionName | default "ssl-redirect" }}
            port:
              name: use-annotation
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.name }}-{{ .Values.environment }}
            port:
              number: {{ .Values.service.port }}
{{- if eq .Values.environment "production" }}
  - host: www.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.ingress.preActionName | default "ssl-redirect" }}
            port:
              name: use-annotation
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.name }}-{{ .Values.environment }}
            port:
              number: {{ .Values.service.port }}
{{- end }}
{{- end }}
