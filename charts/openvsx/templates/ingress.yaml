{{- /* ingress.enabled defaults to true; false skips the Ingress (and its ALB), e.g. for a DR copy. */}}
{{- $ingress := .Values.ingress | default dict }}
{{- if and .Values.eks.enabled (or (not (hasKey $ingress "enabled")) $ingress.enabled) }}
{{- $preActions := .Values.ingress.preActions | default (list "ssl-redirect") }}
{{- /* Hosts served by this Ingress: the main host, www.<host> in production, then ingress.additionalHosts. */}}
{{- $hosts := list .Values.host }}
{{- if eq .Values.environment "production" }}
{{- $hosts = append $hosts (printf "www.%s" .Values.host) }}
{{- end }}
{{- $hosts = concat $hosts ($ingress.additionalHosts | default list) | compact }}
{{- $serviceName := printf "%s-%s" .Values.name .Values.environment }}
{{- $servicePort := .Values.service.port }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-{{ .Values.environment }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "alb" }}
  rules:
  {{- range $host := $hosts }}
  - host: {{ $host }}
    http:
      paths:
      {{- range $action := $preActions }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $action }}
            port:
              name: use-annotation
      {{- end }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $serviceName }}
            port:
              number: {{ $servicePort }}
  {{- end }}
{{- end }}
