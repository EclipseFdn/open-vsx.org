# Default values for openvsx.

name: &name open-vsx-org
environment: &environment production
platform: &platform okd-c1
namespace: &namespace open-vsx-org
host: open-vsx.org

# Toggles all EKS-specific resources (Ingress, ServiceAccount IRSA, ESO, KEDA).
# OKD-only resources (Route, ServiceMonitor, RedisCluster, redis-cluster-operator,
# in-chart Alloy ConfigMap, deployment-configuration-*-aws envFrom) render only
# when this is false.
eks:
  enabled: false

# IRSA ServiceAccount — only created on EKS. On OKD pods use the default SA.
serviceAccount:
  create: false
  name: openvsx
  annotations: {}

# External Secrets Operator — only enabled on EKS (syncs from AWS Secrets Manager).
externalSecrets:
  enabled: false

# KEDA ScaledObject for Tomcat-based autoscaling — only enabled on EKS.
keda:
  enabled: false

replicaCount: 6
esReplicaCount: 3
autoscaling:
  enabled: false

image:
  repository: ghcr.io/eclipsefdn/openvsx-website
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: 97e1417-99

eks:
  enabled: false

# Platform ServiceMonitors (node-exporter, kube-state-metrics) — EKS-only, off by default.
serviceMonitors:
  platformMetrics:
    enabled: false

# EKS-only subchart — OKD has no ALB. Off by default; enabled explicitly on EKS staging.
aws-load-balancer-controller:
  enabled: false

website:
  jvmArgs: >
    -Xms4G -Xmx6G
    -XX:+AlwaysPreTouch
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+UseStringDeduplication
    -XX:+ParallelRefProcEnabled
    -XX:+DisableExplicitGC
    -XX:+UnlockExperimentalVMOptions
    -XX:+UnlockDiagnosticVMOptions
    -XX:-OmitStackTraceInFastThrow
    -Dlog4j2.formatMsgNoLookups=true
    -Dlog4j.formatMsgNoLookups=true
    -Dorg.jooq.no-logo=true
    -Dorg.jooq.no-tips=true
    --enable-native-access=ALL-UNNAMED

route:
  timeout: 10m

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 5000m
    memory: 8Gi
  requests:
    cpu: 3000m
    memory: 8Gi

# elastic search
es:
  # Default ES version for all envs; override per-env. Prod stays 8.18.8 until its own snapshot-gated 8.19->9.2 upgrade.
  version: "8.18.8"
  java_opts: -Xms4g -Xmx4g -Dlog4j2.formatMsgNoLookups=true
  resources:
    limits:
      cpu: 4
      memory: 8Gi
    requests:
      cpu: 1
      memory: 8Gi
  storage_class: cephfs-new
  storage: 1Gi

# redis
redis:
  name: redis
  replicas: 6
  image:
    repository: redis
    tag: "7.2.10"
    pullPolicy: IfNotPresent
  maxmemory: "896mb"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1536Mi"
      cpu: "500m"
  persistence:
    storageGi: 5
    storageClass: cephfs-new
  serviceAccountName: redis-cluster-operator
  clusterRoleName: redis-cluster-operator-role-cluster
  clusterRoleBindingName:  redis-cluster-operator-role-binding-cluster
  roleName: redis-cluster-operator-role
  roleBinding: redis-cluster-operator-role-binding

# grafana alloy
alloy:
  enabled: true
  alloy:
    configMap:
      create: false
      name: "grafana-alloy-configmap-production"
      key: "config.river"
    envFrom:
      - secretRef:
          name: grafana-cloud-secret-production
      - secretRef:
          name: redis-secret-production
    extraPorts:
      - name: zipkin
        port: 9411
        targetPort: 9411
      - name: loki
        port: 3100
        targetPort: 3100
  crds:
    create: true
  controller:
    type: "daemonset"
    podLabels:
      app: *name
      environment: *environment
    nodeSelector:
      openvsx-production-alloy: "true"
  fullnameOverride: grafana-alloy-production
  namespaceOverride: *namespace

clamav:
  enabled: true
  name: "clamav"
  replicas: 1
  image:
    repository: "ghcr.io/eclipsefdn/clamav-rest-new"
    tag: "v0.1.2"
    pullPolicy: Always
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 4
      memory: 6Gi
  service:
    port: 9000
  env:
    MAX_UPLOAD_SIZE_MB: 512
    MAX_EXTRACTED_SIZE_MB: 512
    MAX_FILE_COUNT: 100000
    MAX_SINGLE_FILE_MB: 300
    MAX_RECURSION: 16
    MAX_THREADS: 4
    SCAN_TIMEOUT_MINUTES: 5

# ── Logical Postgres backup (templates/db-backup-cronjob.yaml) ────────────────
# OFF by default and everywhere except aws-staging. Only meaningful where the database
# is the in-cluster postgresql-ha StatefulSet; the RDS environments are covered by RDS
# automated backups + PITR, and the template hard-fails if enabled without
# externalSecrets.inClusterPostgres so it cannot silently activate in prod/test.
dbBackup:
  enabled: false
  # 01:30 UTC — clear of the app's 02:10 usage-stats job, 03:00 gitleaks refresh and
  # ~04:00 search reindex, and of the ElastiCache 01:00-03:00 snapshot window.
  schedule: "30 1 * * *"
  timeZone: "Etc/UTC"
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  # pg_dump -Fc level; 6 is the pg_dump default.
  compression: "6"
  statementTimeoutSeconds: 3000
  # emptyDir for the dump. Must exceed the compressed dump size; also requested as
  # ephemeral-storage below so the scheduler accounts for it.
  scratchSize: 10Gi
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  # Interim: install aws-cli from the alpine repo at container start. Set false once a
  # pinned image carrying pg_dump 17 + aws-cli v2 is published.
  awsCliInstall: true
  s3:
    bucket: ""
    prefix: ""
    region: eu-central-1
  serviceAccount:
    create: true
    # Must match the IRSA trust subject of the role annotated below
    # (system:serviceaccount:<namespace>:openvsx-pg-backup).
    name: openvsx-pg-backup
    annotations: {}
  report:
    # Push the outcome line straight to Grafana Cloud Loki using LOKI_* from
    # grafana-cloud-secret-<env>. Do not rely on scraped stdout: the staging Alloy logs
    # pipeline drops pods in phase Succeeded/Failed, which is where a short-lived Job
    # spends most of its life.
    loki: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
      ephemeral-storage: 10Gi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 12Gi

yara:
  enabled: true
  name: "yara"
  replicas: 1
  image:
    repository: "ghcr.io/eclipsefdn/yara-rest"
    tag: "v0.1.1"
    pullPolicy: Always
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi
  service:
    port: 9001
  env:
    MAX_UPLOAD_SIZE_MB: 512
    MAX_EXTRACTED_SIZE_MB: 1024
    MAX_FILE_COUNT: 100000
    MAX_SINGLE_FILE_MB: 300
    MAX_RECURSION: 0
    SCAN_TIMEOUT_MINUTES: 5
